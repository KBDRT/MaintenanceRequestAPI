apiVersion: 1
groups:
    - orgId: 1
      name: app
      folder: Alerts
      interval: 1m
      rules:
        - uid: ffzwy075ng9ogc
          title: High 5xx rate
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: postgres-main
              model:
                editorMode: code
                format: table
                intervalMs: 60000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: "SELECT\r\n  100.0 * SUM(CASE WHEN \"statusCode\" >= 500 THEN 1 ELSE 0 END)\r\n       / NULLIF(COUNT(*), 0) AS value\r\nFROM \"HttpMetrics\"\r\nWHERE \"createdAt\" > now() - interval '5 minutes';"
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
            - refId: B
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: replaceNN
                    replaceWithValue: 0
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations: {}
          labels: {}
          isPaused: false
          notification_settings:
            receiver: API_WEBHOOK
