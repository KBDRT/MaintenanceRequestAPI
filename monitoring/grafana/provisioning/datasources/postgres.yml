apiVersion: 1

datasources:
  - name: Postgres
    uid: postgres-main
    type: postgres
    access: proxy
    url: db:5432
    database: ${DB_NAME}
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false