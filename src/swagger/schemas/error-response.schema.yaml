components:
  schemas:
    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Поле с ошибкой
        message:
          type: string
          description: Ошибка данного поля

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              description: Код ошибки
            message:
              type: string
              description: Общее сообщение с ошибкой
            requestId:
              type: string
              format: uuid
              description: ID запроса
            details:
              type: array
              description: Список ошибок
              items:
                $ref: '#/components/schemas/ErrorDetail'
      example:
        error:
          code: CONFLICT_ERROR
          message: Пользователь с таким логином уже существует!
          requestId: 186d7dab-5d90-418d-b9b3-c705f7d006a7
          details:
            - field: login
              message: Неуникальный логин пользователя