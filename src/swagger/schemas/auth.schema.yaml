components:
  schemas:
    User:
      type: object
      required:
        - login
        - password
      properties:
        id:
          type: string
          format: uuid
          description: Автоматически сгенерированный ID пользователя
        login:
          type: string
          description: Логин пользователя (имя пользователя)
        role:
          type: string
          enum: ["admin", "viewer", "technician"]
          description: Роль пользователя
      example:
        id: 457dab4b-cc25-46e1-b071-8481e909111f
        login: test
        role: "viewer"

    Token:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Access токен

    LoginUserRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Логин пользователя
          default: user
        password:
          type: string
          description: Пароль пользователя
          default: password