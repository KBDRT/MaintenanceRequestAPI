components:
  parameters:
    equipmentIdsFilter:
      in: query
      name: equipmentsIds
      required: false
      description: Фильтр по ID оборудования
      schema:
        type: array
        items:
          type: string

    requestPriorityFilter:
      in: query
      name: priority
      required: false
      description: Фильтр по приоритету заявки
      schema:
        type: array
        items:
          $ref: '#/components/schemas/MaintenanceRequestPriority'

    requestStatusFilter:
      in: query
      name: status
      required: false
      description: Фильтр по статусу заявки
      schema:
        type: array
        items:
          $ref: '#/components/schemas/MaintenanceRequestStatus'

    requestIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: ID заявки

    assigneeUserIdPath:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
      description: ID специалиста

  schemas:
    AssigneeRole:
      type: string
      description: Роль специалиста в заявке
      enum:
        - lead
        - member

    Technician:
      type: object
      description: Специалист
      properties:
        id:
          type: string
          format: uuid
        tableNumber:
          type: integer
          description: Табельный номер
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        specialization:
          type: string
      example:
        id: 457dab4b-cc25-46e1-b071-8481e909111f
        tableNumber: 1024
        lastName: Иванов
        firstName: Иван
        middleName: Иванович
        specialization: Механик

    MaintenanceRequest:
      type: object
      required:
        - id
        - equipmentId
        - title
        - priority
        - status
      properties:
        id:
          type: string
          format: uuid
        equipmentId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/MaintenanceRequestPriority'
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        planntedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        technicians:
          type: array
          items:
            $ref: '#/components/schemas/Technician'
      example:
        id: 457dab4b-cc25-46e1-b071-8481e909111f
        equipmentId: 8b0f2a71-1234-4a1b-9cde-3f5e6a7b8c90
        title: Замена подшипника
        description: Износ подшипника привода
        priority: high
        status: new
        planntedAt: "2025-03-20T10:00:00Z"
        createdAt: "2025-03-15T08:00:00Z"
        updatedAt: "2025-03-16T09:30:00Z"
        technicians: []

    MaintenanceRequestListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceRequest'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateRequestRequest:
      type: object
      required:
        - equipmentId
        - title
        - priority
      properties:
        equipmentId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/MaintenanceRequestPriority'
        plannedAt:
          type: string
          format: date-time
      example:
        equipmentId: 8b0f2a71-1234-4a1b-9cde-3f5e6a7b8c90
        title: Замена подшипника
        description: Износ подшипника привода
        priority: high

    UpdateRequestRequest:
      type: object
      description: Хотя бы одно поле должно быть заполнено
      properties:
        equipmentId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/MaintenanceRequestPriority'
        plannedAt:
          type: string
          format: date-time
      example:
        priority: critical

    UpdateRequestStatusRequest:
      type: object
      required:
        - newStatus
      properties:
        newStatus:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
      example:
        newStatus: in_progress

    TechnicianAssignment:
      type: object
      required:
        - technicianId
        - role
        - hours
      properties:
        technicianId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AssigneeRole'
        hours:
          type: number
      example:
        technicianId: 457dab4b-cc25-46e1-b071-8481e909111f
        role: lead
        hours: 4.5

    SetRequestTechniciansRequest:
      type: array
      description: Список специалистов для назначения на заявку (без дублей)
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/components/schemas/TechnicianAssignment'
      example:
        - technicianId: 457dab4b-cc25-46e1-b071-8481e909111f
          role: lead
          hours: 4.5
        - technicianId: 8b0f2a71-1234-4a1b-9cde-3f5e6a7b8c90
          role: member
          hours: 2

    CreateMaintenanceRequestMassDto:
      type: object
      properties:
        equipmentId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/MaintenanceRequestPriority'
        planntedAt:
          type: string
          format: date-time

    MassImportRequestItem:
      type: object
      properties:
        importData:
          $ref: '#/components/schemas/CreateMaintenanceRequestMassDto'
        resultData:
          $ref: '#/components/schemas/MaintenanceRequest'
        success:
          type: boolean
        error:
          $ref: '#/components/schemas/Error'

    MassImportRequestsRequest:
      type: array
      description: Массив заявок для массового импорта
      minItems: 1
      maxItems: 1000
      items:
        $ref: '#/components/schemas/CreateMaintenanceRequestMassDto'

    MassImportMeta:
      type: object
      required:
        - requestId
        - totalSuccess
        - totalErrors
      properties:
        requestId:
          type: string
          format: uuid
          description: ID запроса
        totalSuccess:
          type: integer
          description: Количество успешно импортированных заявок
        totalErrors:
          type: integer
          description: Количество заявок с ошибками

    MassImportRequestsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MassImportRequestItem'
        meta:
          $ref: '#/components/schemas/MassImportMeta'

    RequestStatusHistory:
      type: object
      required:
        - id
        - newStatus
      properties:
        id:
          type: string
          format: uuid
        oldStatus:
          allOf:
            - $ref: '#/components/schemas/MaintenanceRequestStatus'
          nullable: true
        newStatus:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        author:
          type: string
          description: ID или логин автора изменения
        commentary:
          type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: 457dab4b-cc25-46e1-b071-8481e909111f
        oldStatus: new
        newStatus: in_progress
        author: tech1
        commentary: Взял в работу
        createdAt: "2025-03-16T09:30:00Z"

    RequestStatusHistoryListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestStatusHistory'