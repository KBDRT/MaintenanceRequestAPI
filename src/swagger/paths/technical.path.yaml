/api/health/ready:
  get:
    tags:
      - Технические
    summary: Жизнеспособность процесса
    security: []
    responses:
      200:
        description: Доступно
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthStatus'
      503:
        description: Проблемы с базой данных
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthStatusError' 

/api/test500:
  get:
    tags:
      - Технические
    summary: Получить 500 ответ для тестирования
    description: Получить 500 ответ для тестирования мониторинга
    security: [{ bearerAuth: [] }]
    responses:
      401:
        description: Не авторизован
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: AUTHENTICATION_ERROR
                message: Невалидный токен
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      403:
        description: Нет прав 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: ACCESS_ERROR
                message: Нет прав
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      500:
        description: Получен 500 для тестирования