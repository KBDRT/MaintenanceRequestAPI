/api/requests:
  get:
    tags:
      - Заявки
    summary: Список заявок
    description: Список заявок с фильтрацией и сортировкой
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/sortDirection'
      - $ref: '#/components/parameters/equipmentIdsFilter'
      - $ref: '#/components/parameters/requestPriorityFilter'
      - $ref: '#/components/parameters/requestStatusFilter'
      - $ref: '#/components/parameters/dateFrom'
      - $ref: '#/components/parameters/dateTo'
      - $ref: '#/components/parameters/paginationPage'
      - $ref: '#/components/parameters/paginationLimit'
    responses:
      200:
        description: Список заявок
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestListResponse'
      400:
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Не авторизован (пустой или невалидный acess токен)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: AUTHENTICATION_ERROR
                message: Токен не предоставлен
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
  post:
    tags:
      - Заявки
    summary: Создание заявки
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRequestRequest'
    responses:
      201:
        description: Заявка создана
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequest'
      400:
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Не авторизован (пустой или невалидный acess токен)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: AUTHENTICATION_ERROR
                message: Токен не предоставлен
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      403:
        description: Нет доступа не хватает прав для операции
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: ACCESS_ERROR
                message: Нет доступа
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      404:
        description: Оборудование не найдено
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: NOT_FOUND
                message: Не найдено
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f

/api/requests/{id}:
  get:
    tags:
      - Заявки
    summary: Получение заявки по ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/requestIdPath'
    responses:
      200:
        description: Данные заявки
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequest'
      401:
        description: Не авторизован (пустой или невалидный acess токен)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: AUTHENTICATION_ERROR
                message: Токен не предоставлен
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      404:
        description: Заявка не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: NOT_FOUND
                message: Не найдено
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f

  patch:
    tags:
      - Заявки
    summary: Обновление заявки
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/requestIdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRequestRequest'
    responses:
      204:
        description: Заявка обновлена
  delete:
    tags:
      - Заявки
    summary: Удаление заявки
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/requestIdPath'
    responses:
      204:
        description: Заявка удалена
      400:
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Не авторизован (пустой или невалидный acess токен)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: AUTHENTICATION_ERROR
                message: Токен не предоставлен
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      403:
        description: Нет доступа не хватает прав для операции
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: ACCESS_ERROR
                message: Нет доступа
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f
      404:
        description: Заявка не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
                error:
                code: NOT_FOUND
                message: Не найдено
                requestId: 457dab4b-cc25-46e1-b071-8481e909111f

